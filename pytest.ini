[pytest]
# Pytest configuration for News Curator project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Markers
markers =
    unit: Unit tests (fast)
    integration: Integration tests (slower)
    e2e: End-to-end tests (slowest)
