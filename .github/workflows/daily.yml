name: Daily NewsCurator

on:
  schedule:
    # 23:45 UTC = 07:45 AM Taipei (UTC+8)
    - cron: '45 23 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Set environment variables
        run: |
          echo "NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=news-curator-creds.json" >> $GITHUB_ENV
          echo "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" >> $GITHUB_ENV
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}" >> $GITHUB_ENV
          echo "LINE_GROUP_ID=${{ secrets.LINE_GROUP_ID }}" >> $GITHUB_ENV
          echo "KEYWORD_LIST=${{ secrets.KEYWORD_LIST }}" >> $GITHUB_ENV
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV

      - name: Write Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > news-curator-creds.json

      - name: Fetch candidates
        run: |
          python -c "
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          taipei = ZoneInfo('Asia/Taipei')
          today = datetime.now(taipei).strftime('%Y-%m-%d')
          output = f'data/candidates-{today}.csv'
          os.makedirs('data', exist_ok=True)

          from src.config import Config
          from src.fetch_candidates import fetch_and_save

          keywords = [k.strip() for k in Config.KEYWORDS if k.strip()]
          count = fetch_and_save(
              api_key=Config.NEWSAPI_KEY,
              keywords=keywords,
              output_filepath=output
          )
          print(f'Fetched {count} articles to {output}')
          "

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/
          git diff --cached --quiet || (git commit -m "chore: daily fetch $(date -u +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Trigger Monday delivery
        run: |
          DAY=$(TZ=Asia/Taipei date +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — triggering delivery..."
            curl -sf -X POST https://chaody.pythonanywhere.com/api/deliver || echo "Delivery request failed"
          else
            echo "Not Monday (day=$DAY), skipping delivery."
          fi
